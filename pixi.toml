[workspace]
name = "vector-data-tutorial"
description = "Introduction to geospatial vector data processing in Python"
authors = ["Hamed Alemohammad"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tasks]
lab = "jupyter lab"

[dependencies]
python = "3.15.*"
jupyterlab = ">=4.6.4,<5"
geopandas = ">=1.2.0,<2"
geodatasets = ">=2026.5.1"
cartopy = ">=0.26.0,<0.27"
shapely = ">=2.2.0,<3"
leafmap = ">=0.63.1,<0.64"
folium = ">=0.20.0,<0.21"
mapclassify = ">=2.11.0,<3"
boto3 = ">=1.43.119,<2"
requests = ">=2.34.2,<3"
pyarrow = ">=25.0.0,<26"
dask = ">=2026.8.0"
distributed = ">=2026.8.0"
dask-labextension = ">=7.0.0,<8"
dask-geopandas = ">=0.5.0,<0.6"
matplotlib = ">=3.11.2,<4"
nbconvert = ">=7.17.2,<8"

[activation.env]
PYTHONPATH="${PIXI_PROJECT_ROOT}"